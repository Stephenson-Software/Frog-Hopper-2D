# Builds the browser (Emscripten) version with web/build.sh and, when enabled,
# deploys it to arcade as https://frog-hopper.play.danielstephenson.dev
name: Browser build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.10
      - name: Build (web/build.sh)
        run: web/build.sh
      - name: Check the page, script and module exist
        run: |
          test -s web/build/index.html
          test -s web/build/index.js
          test -s web/build/index.wasm
          test -s web/build/index.data
      - name: Write the deploy version
        run: echo "$(tr -d '[:space:]' < version.txt)+g${GITHUB_SHA::7}" > web/arcade-version.txt && cat web/arcade-version.txt
      - name: Deploy to arcade
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ARCADE_ENABLED == 'true')
        uses: Stephenson-Software/arcade-deploy@v1
        with:
          slug: frog-hopper
          token: ${{ secrets.ARCADE_TOKEN }}
          site-dir: web/build
          version-file: web/arcade-version.txt
